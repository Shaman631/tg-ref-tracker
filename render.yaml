# Blueprint для PHP-версии трекера.
# Render → New → Blueprint → репозиторий Shaman631/tg-ref-tracker → этот файл.
services:
  - type: web
    name: tg-ref-tracker
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false        # токен от @BotFather
      - key: CHAT_ID
        sync: false        # ваш chat_id (бот ответит на /start)
      - key: CHANNELS
        sync: false        # например: @my_channel,@second_channel
      - key: WEB_KEY
        sync: false        # необязательно: иначе выводится из токена
      - key: SCHEDULE_TIME
        value: "21:00"
      - key: TZ
        value: Europe/Samara
      - key: STATE_FILE
        value: /data/state.json
