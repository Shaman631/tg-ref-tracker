# Прокси для трекера. Замените tracker.example.com на свой домен.
server {
    listen 80;
    server_name tracker.example.com;

    # Если есть сертификат Let's Encrypt, раскомментируйте блок HTTPS
    # и перенаправление с 80 на 443.

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Статика не нужна, но на всякий случай кэшируем картинки
    location ~* \.(css|js|png|jpg|svg)$ {
        root /opt/tg-ref;
        expires 7d;
    }
}
